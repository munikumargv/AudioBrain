<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>SafeSound AI</title>
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme:dark;
  --page:#070b14;--panel:rgba(17,26,46,.62);--panel-solid:#111a2e;--panel-2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --ink:#eef2f8;--ink-2:#b8c1d1;--muted:#7d889c;
  --brand-1:#22d3ee;--brand-2:#8b5cf6;--brand-3:#3987e5;
  --glow:0 0 0 1px rgba(255,255,255,.06),0 18px 50px -12px rgba(0,0,0,.6);
  /* status (fixed) */
  --critical:#d03b3b;--high:#ec835a;--medium:#fab219;--low:#7d889c;--good:#0ca30c;
  /* categorical, dark steps */
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  /* sequential blue (heat) */
  --q0:rgba(255,255,255,.04);--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#6da7ec;--q5:#b7d3f6;
  --grid:#232c40;--axis:#394357;
  --aurora-a:rgba(34,211,238,.20);--aurora-b:rgba(139,92,246,.22);--aurora-c:rgba(57,135,229,.18);
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#eef2f8;--panel:rgba(255,255,255,.72);--panel-solid:#ffffff;--panel-2:rgba(15,23,42,.035);
  --line:rgba(15,23,42,.08);--line-2:rgba(15,23,42,.14);
  --ink:#0b1220;--ink-2:#3d4757;--muted:#6b7385;
  --brand-1:#0891b2;--brand-2:#7c3aed;--brand-3:#2a78d6;
  --glow:0 0 0 1px rgba(15,23,42,.04),0 18px 40px -18px rgba(15,23,42,.25);
  --low:#6b7385;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --q0:rgba(15,23,42,.04);--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#1c5cab;
  --grid:#e2e6ee;--axis:#c3c9d4;
  --aurora-a:rgba(34,211,238,.18);--aurora-b:rgba(139,92,246,.14);--aurora-c:rgba(57,135,229,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:clip}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.aurora{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;filter:blur(60px);
  background:radial-gradient(40vmax 30vmax at 15% 20%,var(--aurora-a),transparent 60%),
             radial-gradient(45vmax 35vmax at 85% 15%,var(--aurora-b),transparent 60%),
             radial-gradient(50vmax 40vmax at 60% 95%,var(--aurora-c),transparent 60%);
  animation:drift 26s ease-in-out infinite alternate}
.gridbg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
@keyframes drift{to{transform:translate3d(4vmax,-3vmax,0) rotate(8deg)}}

/* ---------- chrome ---------- */
.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--glow);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:color-mix(in srgb,var(--page) 70%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.3px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand-1),var(--brand-2));box-shadow:0 0 24px -4px var(--brand-1)}
nav{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-weight:600;font-size:13px;transition:.2s}
nav button:hover{color:var(--ink)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--brand-3),var(--brand-2));box-shadow:0 6px 18px -6px var(--brand-2)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:.2s}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.iconbtn b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;font-size:11px;line-height:18px;color:#fff;background:var(--critical);box-shadow:0 0 12px var(--critical)}
.avatar{display:flex;align-items:center;gap:9px;padding:3px 10px 3px 3px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap}
.avatar span.a{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand-2),var(--brand-1))}
.avatar div{font-size:12px;line-height:1.2}.avatar small{color:var(--muted)}
main{max-width:1320px;margin:0 auto;padding:18px}
.banner{margin:12px 18px 0;padding:9px 14px;border-radius:12px;font-size:13px;color:var(--ink-2);border:1px dashed color-mix(in srgb,var(--medium) 55%,transparent);background:color-mix(in srgb,var(--medium) 10%,transparent)}
.banner b{color:var(--medium)}

/* ---------- building blocks ---------- */
.card{padding:16px 18px}
.title{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 12px;font-size:15px;font-weight:700}
.title .sub{font-weight:500;color:var(--muted);font-size:12px}
.title .grow{flex:1}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.two{grid-template-columns:1.55fr 1fr;margin-bottom:16px}
.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}
@media (max-width:700px){.hide-sm{display:none!important}.title .sub{display:none}header{flex-wrap:wrap;padding:10px 12px}nav{order:5;flex-basis:100%}main{padding:12px}.live{display:none}}
.kpi{position:relative;overflow:hidden;padding:16px 18px 10px}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--k,var(--brand-1)),transparent)}
.kpi .l{color:var(--ink-2);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .l i{width:8px;height:8px;border-radius:2px;background:var(--k)}
.kpi .v{font-size:38px;font-weight:800;line-height:1.1;margin-top:6px;letter-spacing:-.5px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi svg{display:block;width:100%;height:42px;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.lv-critical{color:var(--critical);background:color-mix(in srgb,var(--critical) 16%,transparent);border-color:color-mix(in srgb,var(--critical) 35%,transparent)}
.lv-high{color:var(--high);background:color-mix(in srgb,var(--high) 15%,transparent);border-color:color-mix(in srgb,var(--high) 32%,transparent)}
.lv-medium{color:var(--medium);background:color-mix(in srgb,var(--medium) 14%,transparent);border-color:color-mix(in srgb,var(--medium) 30%,transparent)}
.lv-low{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent);border-color:color-mix(in srgb,var(--low) 28%,transparent)}
:root[data-theme="light"] .lv-high{color:#b5501f}:root[data-theme="light"] .lv-medium{color:#8a6200}
.st{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);text-transform:capitalize}
.st-new{color:#fff;background:linear-gradient(135deg,var(--critical),#a21caf);border:0}
.st-resolved{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.st-acknowledged{color:var(--medium);border-color:color-mix(in srgb,var(--medium) 35%,transparent)}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--panel-2);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.18s}
.btn:hover{border-color:var(--brand-1);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-1) 18%,transparent)}
.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--brand-3),var(--brand-2));box-shadow:0 10px 24px -10px var(--brand-2)}
.btn.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);color:var(--good)}
.btn.bad{border-color:color-mix(in srgb,var(--critical) 50%,transparent);color:var(--critical)}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--brand-1);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-1) 20%,transparent)}
select option{background:var(--panel-solid)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover td{background:var(--panel-2)}
.tablewrap{overflow-x:auto}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--panel-2);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--brand-3),var(--brand-2))}
.empty{padding:34px;text-align:center;color:var(--muted)}
.fade{animation:fadeup .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}

/* ---------- live feed ---------- */
.feed{display:flex;flex-direction:column;gap:10px;max-height:388px;overflow:auto;padding-right:4px}
.fcard{flex:none;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;position:relative;overflow:hidden;transition:.2s}
.fcard:hover{transform:translateX(3px);border-color:var(--line-2)}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.fcard.hot{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 26px -10px var(--c)}
.fcard .t{font-weight:700;font-size:13px}.fcard .m{font-size:12px;color:var(--muted)}
.fcard .x{flex:1;min-width:0}.fcard .x div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- campus map ---------- */
.map svg{width:100%;height:auto;display:block}
.map .bld{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1}
.map .bldl{fill:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.map .road{stroke:var(--line-2);stroke-dasharray:4 6;fill:none}
.map .node{cursor:pointer}
.map .node .core{transition:r .3s}
.map .node:hover .core{stroke:var(--ink);stroke-width:2}
.map .node text{fill:var(--ink);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--page);stroke-width:3px}
.map .ring{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:radar 2.2s ease-out infinite}
.map .ring.r2{animation-delay:1.1s}
@keyframes radar{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.55);backdrop-filter:blur(3px);z-index:30;opacity:0;pointer-events:none;transition:.25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:31;overflow:auto;padding:22px;border-radius:22px 0 0 22px;
  transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);background:var(--panel-solid);border-left:1px solid var(--line-2);box-shadow:-30px 0 80px -20px rgba(0,0,0,.6)}
.drawer.open{transform:none}
.hero{display:flex;gap:20px;align-items:center;margin:16px 0 18px}
.ring-wrap{position:relative;width:150px;height:150px;flex:none}
.ring-wrap .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-wrap .n b{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px}
.ring-wrap .n small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
.meter{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2)}
.meter .h{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meter .v{font-size:22px;font-weight:800;margin:2px 0 6px}
.bar{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.factors{position:relative;margin:6px 0 0 6px;padding-left:18px;border-left:1px dashed var(--line-2)}
.factor{position:relative;display:flex;gap:10px;padding:7px 0;font-size:13px}
.factor::before{content:"";position:absolute;left:-23px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--fc,var(--brand-1));box-shadow:0 0 10px var(--fc,var(--brand-1))}
.factor .src{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px;flex:none;padding-top:2px}
.factor .lab{flex:1}.factor .val{color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink-2);margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.privacy svg{color:var(--good);flex:none}
.notes{position:fixed;right:18px;top:62px;width:min(400px,calc(100% - 36px));max-height:70vh;overflow:auto;z-index:25;padding:12px;display:none}
.notes.open{display:block}
.note{padding:10px;border-radius:12px;cursor:pointer;display:flex;gap:10px}
.note:hover{background:var(--panel-2)}
.note i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--c)}

/* ---------- charts ---------- */
.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:10px;font-size:12px;background:var(--panel-solid);border:1px solid var(--line-2);box-shadow:var(--glow);opacity:0;transition:opacity .12s;max-width:240px}
.tip.on{opacity:1}
.hbars .row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 36px;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.hbars .row span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .track{height:12px;border-radius:0 4px 4px 0;position:relative}
.hbars .fill{height:100%;border-radius:0 4px 4px 0;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hbars em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.heat{overflow-x:auto}
.heat table{border-spacing:3px;width:auto}
.heat td{padding:0;border:0}
.heat td.c{width:34px;height:28px;border-radius:6px;text-align:center;font-size:11px;font-weight:700;color:transparent;transition:transform .15s}
.heat td.c:hover{transform:scale(1.15);outline:2px solid var(--ink);color:var(--ink)}
.heat td.name{font-size:12px;color:var(--ink-2);white-space:nowrap;padding-right:10px}
.heat th{border:0;padding:2px;text-align:center;font-size:10px}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:10px}
.scale i{width:22px;height:10px;border-radius:3px}
.area svg{width:100%;height:220px;display:block;overflow:visible}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px;max-width:1150px;margin:0 auto;padding:30px}
.pitch h1{font-size:46px;line-height:1.05;margin:16px 0 14px;letter-spacing:-1px}
.pitch h1 span{background:linear-gradient(90deg,var(--brand-1),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pitch p{color:var(--ink-2);font-size:16px;max-width:520px}
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;max-width:540px}
.feat{padding:12px 14px;border-radius:14px;font-size:13px;color:var(--ink-2)}
.feat b{display:block;color:var(--ink);margin-bottom:2px}
.lcard{padding:28px}
.lcard label{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--ink-2)}
.lcard input{width:100%}
.users{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eq{display:flex;align-items:flex-end;gap:4px;height:40px}
.eq i{width:6px;border-radius:3px;background:linear-gradient(var(--brand-1),var(--brand-2));animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@media (max-width:900px){.login{grid-template-columns:1fr}.pitch h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"></div><div class="gridbg"></div>
<div id="app"></div>
<div class="tip" id="tip"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st = {token: sessionStorage.getItem("ss_token"), me: null, tab: "live", incidents: [], notes: [], locs: [], loc: ""};
const LEVEL = {critical:"Critical", high:"High", medium:"Medium", low:"Low"};
const LVC = {critical:"var(--critical)", high:"var(--high)", medium:"var(--medium)", low:"var(--low)"};
const TYPE = {vape:"Vape", smoke:"Smoke", aerosol_spike:"Aerosol spike", keyword:"Keyword"};
const TYPEC = {vape:"var(--s1)", smoke:"var(--s2)", aerosol_spike:"var(--s3)", keyword:"var(--s4)"};  // fixed per entity
const has = p => st.me?.permissions.includes(p);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
document.documentElement.dataset.theme = store.get("ss_theme") || "dark";

// ---------- static demo (GitHub Pages): answer API calls from a build-time snapshot ----------
const STATIC = !!window.SAFESOUND_STATIC;
const demo = {snap: null};
const CAT_WEIGHT = {drug_name: 0.4, drug_slang: 0.45, deal_phrase: 0.25, hiding_phrase: 0.25};
async function loadSnap(user) {
  const r = await fetch(`demo-data/${encodeURIComponent(user)}.json`);
  if (!r.ok) return false;
  demo.snap = await r.json();
  return true;
}
async function staticApi(path, opts) {
  const method = opts.method || "GET", body = opts.body ? JSON.parse(opts.body) : {};
  const [p, qs] = path.split("?"), q = new URLSearchParams(qs || "");
  if (p === "/api/auth/login") {
    if (body.password !== "safesound123" || !(await loadSnap(body.username))) throw new Error("wrong username or password");
    return {token: "static:" + body.username, user: demo.snap.me};
  }
  if (!demo.snap && !(await loadSnap((st.token || "").replace("static:", "")))) { logout(); throw new Error("signed out"); }
  const s = demo.snap, me = s.me, now = new Date().toISOString();
  const allowed = v => { if (v == null) throw new Error("not allowed for your role"); return v; };
  let m;
  if (p === "/api/auth/logout") return {ok: true};
  if (p === "/api/me") return me;
  if (p === "/api/incidents") {
    let rows = s.incidents.filter(i => q.get("status") ? i.status === q.get("status") : (q.get("include_suppressed") === "true" || i.status !== "suppressed"));
    if (q.get("level")) rows = rows.filter(i => i.level === q.get("level"));
    if (q.get("location_id")) rows = rows.filter(i => i.location_id === q.get("location_id"));
    return rows;
  }
  if ((m = p.match(/^\/api\/incidents\/(\d+)(?:\/(ack|resolve))?$/))) {
    const d = s.details[m[1]], row = s.incidents.find(i => i.id === +m[1]);
    if (!d) throw new Error("incident not found");
    if (m[2] === "ack") Object.assign(d, {status: "acknowledged", acknowledged_by: me.display_name, acknowledged_at: now});
    if (m[2] === "resolve") Object.assign(d, {status: "resolved", outcome: body.outcome, notes: body.notes, resolved_by: me.display_name, resolved_at: now});
    Object.assign(row, {status: d.status, outcome: d.outcome});
    return d;
  }
  if (p === "/api/notifications") return s.notifications;
  if (p === "/api/notifications/read") { s.notifications.forEach(n => n.unread = false); return {ok: true}; }
  if (p === "/api/reports/hotspots") return allowed(s.hotspots[q.get("days") || "30"]);
  if (p === "/api/keywords" && method === "GET") return allowed(s.keywords);
  if (p === "/api/keywords" && method === "POST") {
    const kws = s.keywords.keywords;
    if (kws.some(k => k.term === body.term.trim())) throw new Error("term already exists");
    const w = CAT_WEIGHT[body.category];
    kws.unshift({id: Math.max(0, ...kws.map(k => k.id)) + 1, term: body.term.trim(), lang: body.lang, category: body.category, weight: null,
      enabled: 1, confirmed: 0, false_alarms: 0, base_weight: w, feedback_factor: 1, effective_weight: w, suggest_review: false});
    s.keywords.version++;
    return {ok: true};
  }
  if ((m = p.match(/^\/api\/keywords\/(\d+)$/))) {
    const kws = s.keywords.keywords, k = kws.find(k => k.id === +m[1]);
    if (method === "DELETE") s.keywords.keywords = kws.filter(x => x !== k);
    else if (k && body.enabled != null) k.enabled = body.enabled ? 1 : 0;
    s.keywords.version++;
    return {ok: true};
  }
  if (p === "/api/devices" && method === "GET") return allowed(s.devices);
  if (p === "/api/locations") return s.locations;
  if (p === "/api/audit") return allowed(s.audit);
  if (p === "/api/settings") return method === "PATCH" ? Object.assign(allowed(s.settings), body) : allowed(s.settings);
  throw new Error("this needs the live server - run SafeSound in Codespaces or locally");
}

async function api(path, opts = {}) {
  if (STATIC) return staticApi(path, opts);
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", ...(st.token ? {Authorization: "Bearer " + st.token} : {}), ...(opts.headers || {})}});
  if (r.status === 401 && st.token) { logout(); throw new Error("signed out"); }
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : null;
  if (!r.ok) throw new Error(typeof body?.detail === "string" ? body.detail : r.statusText);
  return body;
}

function countUp(el, to, ms = 900) {
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function ring(score, level, size = 150) {

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="12"/>

      stroke-dasharray="${c}" stroke-dashoffset="${c}" data-to="${c * (1 - score / 100)}" filter="url(#rgl)" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}

// area / line chart with crosshair + tooltip; pts = [{x:label, y:number}]
function areaChart(el, pts, {color = "var(--s1)", spark = false, unit = "incidents"} = {}) {
  const W = 600, H = spark ? 42 : 220, pl = spark ? 2 : 34, pr = spark ? 2 : 10, pt = spark ? 4 : 12, pb = spark ? 2 : 24;
  const max = Math.max(1, ...pts.map(p => p.y)), n = pts.length;
  const X = i => pl + (n === 1 ? 0 : i * (W - pl - pr) / (n - 1)), Y = v => H - pb - v * (H - pt - pb) / max;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const ticks = spark ? "" : [0, .5, 1].map(f => { const v = Math.round(max * f); return `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`; }).join("")
    + pts.map((p, i) => i % Math.ceil(n / 6) === 0 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${p.x.slice(5)}</text>` : "").join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ${spark ? 'style="height:42px"' : ""}>
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks}<path d="${line}L${X(n - 1)},${H - pb}L${X(0)},${H - pb}Z" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="var(--ink-2)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity="0"/>
    <circle class="xd" r="${spark ? 3 : 5}" fill="${color}" stroke="var(--panel-solid)" stroke-width="2" opacity="0" vector-effect="non-scaling-stroke"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.firstChild, xh = $(".xh", svg), xd = $(".xd", svg);
  svg.addEventListener("mousemove", e => { const r = svg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((fx - pl) / ((W - pl - pr) / Math.max(1, n - 1)))));
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("opacity", 1);
    xd.setAttribute("cx", X(i)); xd.setAttribute("cy", Y(pts[i].y)); xd.setAttribute("opacity", 1);
    tip.dataset.lock = 1; showTip(`<b>${pts[i].y}</b> ${unit}<div class="muted">${pts[i].x}</div>`, e.clientX, e.clientY); });
  svg.addEventListener("mouseleave", () => { xh.setAttribute("opacity", 0); xd.setAttribute("opacity", 0); delete tip.dataset.lock; hideTip(); });
}
function hbars(rows, color) {  // rows: [label, value, color?]
  const max = Math.max(1, ...rows.map(r => r[1]));

}

async function refreshLive(first = true) {

  const tz = st.me.timezone, days = lastDays(14, tz);
  const perDay = f => days.map(d => ({x: d, y: all.filter(i => f(i) && dayKey(i.ts, tz) === d).length}));
  const k = [
    ["New alerts", all.filter(i => i.status === "new").length, "var(--critical)", perDay(i => i.routed_roles.length > 0), "routed alerts / day"],
    ["Critical open", all.filter(i => i.status === "new" && i.level === "critical").length, "var(--brand-2)", perDay(i => i.level === "critical"), "critical / day"],
    ["In progress", all.filter(i => i.status === "acknowledged").length, "var(--medium)", perDay(i => i.status === "acknowledged"), "acknowledged / day"],
    ["Logged only", all.filter(i => i.status === "logged" || i.status === "suppressed").length, "var(--s1)", perDay(i => i.status === "logged" || i.status === "suppressed"), "logged / day"],
  ];
  if (first) {
    $("#kpis").innerHTML = k.map(([l, v, c], j) => `<div class="glass kpi fade" style="--k:${c};animation-delay:${j * .05}s"><div class="l"><i></i>${l}</div><div class="v" data-count="${v}">0</div><div class="spark"></div><div class="d">last 14 days</div></div>`).join("");

  $("#feed").innerHTML = open.length ? open.map((i, j) => `<div class="fcard ${i.status === "new" && (i.level === "critical" || i.level === "high") ? "hot" : ""} ${first ? "fade" : ""}" style="--c:${LVC[i.level]};animation-delay:${j * .04}s" data-id="${i.id}">
    ${miniRing(i.score, i.level)}<div class="x"><div class="t">${esc(i.location_name)}</div><div class="m">${types(i.types)} · ${esc(i.context.describe || "")}</div><div class="m">${esc(i.action)} · ${ago(i.ts)}</div></div>${stPill(i.status)}</div>`).join("")
    : `<div class="empty">All clear — no open alerts.</div>`;

  if (filters.level) rows = rows.filter(i => i.level === filters.level);
  if (st.loc) rows = rows.filter(i => i.location_id === st.loc);
  $("#locsub").textContent = st.loc ? "· " + (st.locs.find(l => l.id === st.loc)?.name || st.loc) : `· ${rows.length} shown`;
  $("#list").innerHTML = rows.length ? `<table><thead><tr><th>Score</th><th>Location</th><th>Detection</th><th class="hide-sm">Context</th><th>Time</th><th class="hide-sm">Action</th><th>Status</th></tr></thead><tbody>
  ${rows.map(i => `<tr class="click" data-id="${i.id}"><td><span class="score" style="font-size:16px">${i.score}</span> ${lvPill(i.level)}</td>
    <td><b>${esc(i.location_name)}</b></td><td>${i.types.map(t => `<span class="small" style="display:inline-flex;align-items:center;gap:5px;margin-right:6px"><i style="width:8px;height:8px;border-radius:2px;background:${TYPEC[t]}"></i>${TYPE[t] || t}</span>`).join("")}</td>
    <td class="hide-sm muted">${esc(i.context.describe || "")}</td><td class="small">${fmtTime(i.ts)}</td><td class="hide-sm small">${esc(i.action)}</td><td>${stPill(i.status)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">No incidents match. Run the simulator to generate demo alerts.</div>`;
  $$("#list tr.click").forEach(r => r.onclick = () => openIncident(+r.dataset.id));
}
function drawMap(all) {
  const el = $("#map"); if (!el) return;
  const rank = {critical: 4, high: 3, medium: 2, low: 1};
  const since = Date.now() - 30 * 864e5;
  let extra = 0;
  const nodes = st.locs.map(l => {
    const mine = all.filter(i => i.location_id === l.id);
    const open = mine.filter(i => i.status === "new" || i.status === "acknowledged");
    const worst = open.reduce((w, i) => rank[i.level] > rank[w] ? i.level : w, "low");
    const recent = mine.filter(i => new Date(i.ts) > since && i.status !== "suppressed").length;
    const [x, y] = MAP[l.id] || [40 + 70 * (extra++ % 8), 320];
    return {l, x, y, open: open.length, worst: open.length ? worst : null, recent};
  });
  const sig = JSON.stringify([st.loc, nodes.map(n => [n.open, n.worst, n.recent])]);
  if (el.dataset.sig === sig) return;  // keep the pulse animation running between polls
  el.dataset.sig = sig;
  const maxR = Math.max(1, ...nodes.map(n => n.recent));
  const bld = (x, y, w, h, t) => `<rect class="bld" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/><text class="bldl" x="${x + 12}" y="${y + 20}">${t}</text>`;
  el.innerHTML = `<svg viewBox="0 0 620 340">
    <path class="road" d="M20 168 H600 M224 20 V330 M412 20 V330"/>
    ${bld(36, 40, 172, 108, "Block A")}${bld(232, 40, 168, 108, "Block B")}${bld(424, 40, 140, 108, "Block C")}
    ${bld(36, 188, 172, 104, "Sports hall")}${bld(256, 188, 140, 90, "Canteen")}${bld(430, 196, 140, 88, "Bus bay")}
    ${nodes.map(n => { const c = n.worst ? LVC[n.worst] : "var(--good)", r = 7 + 9 * Math.sqrt(n.recent / maxR), sel = st.loc === n.l.id;
      return `<g class="node" data-loc="${n.l.id}" data-tip="<b>${esc(n.l.name)}</b><br>${n.open} open alert${n.open === 1 ? "" : "s"}${n.worst ? " · worst " + LEVEL[n.worst] : ""}<br>${n.recent} incidents in 30 days${n.l.sensitive ? "<br><span class='muted'>No cameras inside</span>" : ""}">
        ${n.open ? `<circle class="ring" cx="${n.x}" cy="${n.y}" r="${r}" stroke="${c}"/><circle class="ring r2" cx="${n.x}" cy="${n.y}" r="${r}" stroke="${c}"/>` : ""}
        <circle class="core" cx="${n.x}" cy="${n.y}" r="${r}" fill="${c}" fill-opacity=".9" stroke="${sel ? "var(--ink)" : "var(--page)"}" stroke-width="${sel ? 3 : 2}"/>
        <text x="${n.x}" y="${n.y + r + 13}" text-anchor="middle">${esc(n.l.name.replace("Washroom – ", "WC ").replace("School ", ""))}</text></g>`; }).join("")}
  </svg>`;
  $$(".node", el).forEach(g => g.onclick = () => { st.loc = st.loc === g.dataset.loc ? "" : g.dataset.loc; $("#allloc").classList.toggle("on", !st.loc); refreshLive(false); });
}

  $("#df").onsubmit = async e => { e.preventDefault(); const f = e.target;
    try { const r = await api("/api/devices", {method: "POST", body: JSON.stringify({id: f.id.value, location_id: f.loc.value, name: f.name.value})});
      $("#dk").innerHTML = `Device key (shown once): <code>${esc(r.device_key)}</code>`; } catch (err) { $("#dk").textContent = err.message; } };
}

// ---------- audit ----------
async function auditView() {
  const rows = await api("/api/audit?limit=300");
  const AC = {login: "var(--good)", login_failed: "var(--critical)", denied: "var(--critical)", resolve: "var(--brand-2)", acknowledge: "var(--medium)", view_incident: "var(--s1)"};
  $("#view").innerHTML = `<div class="glass card fade"><div class="title">Audit trail <span class="sub">every sign-in, incident view, response and configuration change</span></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th class="hide-sm">Detail</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td class="small">${fmtTime(r.ts)}</td><td><b>${esc(r.actor)}</b></td><td><span class="st" style="color:${AC[r.action] || "var(--ink-2)"}">${esc(r.action.replace("_", " "))}</span></td><td class="small">${esc(r.target)}</td><td class="small muted hide-sm">${esc(r.detail)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

// ---------- settings ----------
async function settingsView() {
  const s = await api("/api/settings");
  $("#view").innerHTML = `<div class="glass card fade" style="max-width:640px"><div class="title" style="font-size:18px">School settings</div><form id="sf">
  <label class="small muted">Alert threshold — Fusion Score that notifies staff</label>
  <div style="display:flex;gap:14px;align-items:center;margin:6px 0 4px"><input type="range" name="t" min="40" max="90" value="${s.alert_threshold}" style="flex:1;accent-color:var(--brand-2)"><b id="tv" style="font-size:26px;min-width:44px;text-align:right">${s.alert_threshold}</b></div>
  <div class="small muted" style="margin-bottom:14px">Lower = more alerts; higher = fewer false alarms.</div>
  <label class="small muted">Data retention (days) — incidents are deleted after this</label><br><input type="number" name="r" min="7" max="730" value="${s.retention_days}" style="margin:6px 0 14px">
  <br><label class="small muted">Mobile push / SMS webhooks per role (JSON)</label><textarea name="w" rows="4" style="width:100%;margin-top:6px;font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(s.notify_webhooks, null, 2))}</textarea>
  <div style="margin-top:14px"><button class="btn primary">Save settings</button> <span id="ss" class="small muted"></span></div></form></div>`;
  $("#sf").t.oninput = e => $("#tv").textContent = e.target.value;
  $("#sf").onsubmit = async e => { e.preventDefault(); const f = e.target;
    try { await api("/api/settings", {method: "PATCH", body: JSON.stringify({alert_threshold: +f.t.value, retention_days: +f.r.value, notify_webhooks: JSON.parse(f.w.value || "{}")})}); $("#ss").textContent = "✓ Saved"; }
    catch (err) { $("#ss").textContent = err.message; } };
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
render();
</script>
</body>
</html>
